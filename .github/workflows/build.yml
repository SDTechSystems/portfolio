# Compila el sitio en cada PR y en cada cambio a main.
# `npm run build` también revisa productos.json y tienda.ts (src/lib/catalogo.ts):
# si hay un error de tipeo, el PR queda en rojo con la lista de qué corregir.
name: Build

on:
  pull_request:
  push:
    branches: [main]
  # Botón "Run workflow" en la pestaña Actions, para relanzarlo a mano.
  workflow_dispatch:

permissions:
  contents: read

# Si llega otro push al mismo PR, cancela la ejecución anterior.
# En main no se cancela el build que ya está corriendo: cada fusión termina el suyo.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # El job no hace push: no hace falta dejar el token guardado en el runner.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
