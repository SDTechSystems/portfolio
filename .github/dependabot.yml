# Abre PRs con actualizaciones cada lunes. El CI (workflows/build.yml) compila cada una,
# así que solo hay que fusionar las que salgan en verde.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    # Parches y versiones menores juntos en un solo PR; una versión mayor de Astro llega aparte
    # porque puede romper cosas y conviene revisarla.
    groups:
      dependencias:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    # Espera a que una versión lleve unos días publicada antes de proponerla: los paquetes
    # comprometidos en npm suelen retirarse en ese tiempo. Las de seguridad llegan sin esperar.
    cooldown:
      default-days: 3
      semver-major-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    groups:
      acciones:
        patterns: ["*"]
