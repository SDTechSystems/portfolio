<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ================================================================ data
const Q = new URLSearchParams(location.search);
const SCENE = Q.get('scene'), SLUG = Q.get('brand');
const DATA = await (await fetch('/src/data/brand-showcase.json')).json();
const B = DATA.brands.find((b) => b.slug === SLUG);
const C = Object.fromEntries(B.colors.map((c) => [c.key, c.hex]));
const strong = B.surfaces.strong, lightC = B.surfaces.light;
const GOLD = C.gold || null;
const hex6 = (h) => (h.length === 4 ? '#' + [...h.slice(1)].map((c) => c + c).join('') : h);
const rgb = (h) => { h = hex6(h); return [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); };
const lum = (h) => { const f = (v) => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }; const [r, g, b] = rgb(h); return .2126 * f(r) + .7152 * f(g) + .0722 * f(b); };
const mix = (a, b, t) => { const x = rgb(a), y = rgb(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const sat = (h) => { const [r, g, b] = rgb(h).map((v) => v / 255); const mx = Math.max(r, g, b), mn = Math.min(r, g, b); return mx === mn ? 0 : (mx - mn) / (1 - Math.abs(mx + mn - 1)); };
const dist = (a, b) => { const x = rgb(a), y = rgb(b); return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]); };
const pal = B.colors.map((c) => c.hex);
const SEC = pal.filter((h) => dist(h, strong) > 70 && dist(h, lightC) > 70).sort((a, b) => sat(b) - sat(a))[0] || mix(strong, '#ffffff', .35);
const onDark = lum(strong) < .25;               // the strong surface is dark
const strongIsBase = DATA && B.versions[0].bg.toUpperCase() === strong.toUpperCase(); // principal logo was drawn for the strong colour

// ================================================================ studio (lessons: neutral tone mapping, low env, soft VSM, pool light, supersampling)
const W = 1200, H = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio); renderer.setSize(W, H);
renderer.toneMapping = THREE.NeutralToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = .32;
const camera = new THREE.PerspectiveCamera(30, W / H, .1, 200);
const key = new THREE.DirectionalLight(0xfff4e8, 2.7);
key.position.set(-4.5, 10, 4); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 18; key.shadow.blurSamples = 25;
key.shadow.bias = -.0004; key.shadow.intensity = .62;
Object.assign(key.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 40 }); scene.add(key);
const fill = new THREE.DirectionalLight(0xe2e9ff, .4); fill.position.set(6, 4, 5); scene.add(fill);
const hemi = new THREE.HemisphereLight(0xffffff, 0x3a3a3a, .14); scene.add(hemi);
const pool = new THREE.SpotLight(0xfff3e4, 120, 50, .5, 1, 1.5); pool.position.set(0, 8, 8); pool.target.position.set(0, 2.5, -9); scene.add(pool, pool.target);

function sweepGeo(width, depth, rad, height) {
  const prof = []; for (let i = 0; i <= 12; i++) prof.push([depth - depth * i / 12, 0]);
  for (let i = 1; i <= 28; i++) { const a = (Math.PI / 2) * i / 28; prof.push([-Math.sin(a) * rad, rad - Math.cos(a) * rad]); }
  for (let i = 1; i <= 8; i++) prof.push([-rad, rad + (height - rad) * i / 8]);
  const v = [], idx = []; prof.forEach(([z, y]) => { v.push(-width / 2, y, z, width / 2, y, z); });
  for (let i = 0; i < prof.length - 1; i++) { const a = i * 2, b = a + 2; idx.push(a, a + 1, b, a + 1, b + 1, b); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); g.setIndex(idx); g.computeVertexNormals(); return g;
}
let backdrop;
function studio(color, wallZ = -3.5, rad = 6) {
  backdrop = new THREE.Mesh(sweepGeo(80, 40, rad, 40), new THREE.MeshStandardMaterial({ color, roughness: .93, envMapIntensity: .2, side: THREE.DoubleSide }));
  backdrop.position.z = wallZ; backdrop.receiveShadow = true; scene.add(backdrop);
}
const lightBackdrop = () => mix(mix(lightC, '#c9c5bf', .55), '#000000', .06);
const darkBackdrop = () => mix(strong, '#0b0b0d', .55);

// ================================================================ textures
const RES = 2;
const load = (src) => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error('load ' + src)); i.src = src; });
const logo = (f) => load(`/public/marcas/${SLUG}/${f}`);
const art = (f) => load(`/tools/brand-showcase/.cache/art/${SLUG}/${f}`);
function canvas(w, h, bg, res = RES) { const c = document.createElement('canvas'); c.width = w * res; c.height = h * res; const g = c.getContext('2d'); g.scale(res, res); g.imageSmoothingQuality = 'high'; if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); } return [c, g]; }
const put = (g, c) => g.drawImage(c, 0, 0, c.width / RES, c.height / RES);
function draw(g, img, cx, cy, mw, mh) { const s = Math.min(mw / img.width, mh / img.height); const w = img.width * s, h = img.height * s; g.drawImage(img, cx - w / 2, cy - h / 2, w, h); }
function tint(img, color, w, h) { const [c, g] = canvas(w, h, null, 1); g.drawImage(img, 0, 0, w, h); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, w, h); return c; }
function thicken(c, r) { const [t, g] = canvas(c.width, c.height, null, 1); for (let a = 0; a < 8; a++) g.drawImage(c, Math.cos(a * Math.PI / 4) * r, Math.sin(a * Math.PI / 4) * r); g.drawImage(c, 0, 0); return t; }
async function layer(img, w, h, box, color, thick = 1.4) {
  const [c, g] = canvas(w, h); const [cx, cy, mw, mh] = box;
  draw(g, color ? tint(img, color, img.width * 6, img.height * 6) : img, cx, cy, mw, mh);
  return thick ? thicken(c, thick) : c;
}
function rasterArt(img, w, h) { const [c, g] = canvas(w, h, null, 1.5); g.drawImage(img, 0, 0, w, h); return c; }
function alphaOf(src) { const [c, g] = canvas(src.width, src.height, null, 1); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  const [o, og] = canvas(src.width, src.height, '#000', 1); og.drawImage(c, 0, 0); return o; }
function grain(c, a = 12) { const g = c.getContext('2d'); const d = g.getImageData(0, 0, c.width, c.height); for (let i = 0; i < d.data.length; i += 4) { const n = (Math.random() - .5) * a; d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n; } g.putImageData(d, 0, 0); return c; }
const tex = (c, srgb = true) => { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; return t; };
// crop a region of an existing flat mockup (used for screens)
async function crop(file, x, y, w, h, scale = 3) { const img = await logo(file); const [c, g] = canvas(w, h, null, scale); g.drawImage(img, -x, -y, 1200, 900); return c; }
const paperMat = (map, rough = .85, extra = {}) => new THREE.MeshStandardMaterial({ map, roughness: rough, envMapIntensity: .35, ...extra });
const goldMat = (alpha) => new THREE.MeshPhysicalMaterial({ color: 0xd9b45f, metalness: 1, roughness: .2, alphaMap: alpha, transparent: true, alphaTest: .12, bumpMap: alpha, bumpScale: 1.2, envMapIntensity: 3 });
const chrome = () => new THREE.MeshPhysicalMaterial({ color: 0xe4e6ea, metalness: 1, roughness: .14, envMapIntensity: 3, clearcoat: .4 });
const brass = () => new THREE.MeshPhysicalMaterial({ color: GOLD || 0xc9a45c, metalness: 1, roughness: .25, envMapIntensity: 2.6 });
function contactShadow(x, z, sx, sz, op = .6, y = .003) {
  const [c, g] = canvas(256, 256, null, 1); const r = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  r.addColorStop(0, `rgba(0,0,0,${op})`); r.addColorStop(.5, `rgba(0,0,0,${op * .4})`); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, 256, 256);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(sx, sz), new THREE.MeshBasicMaterial({ map: tex(c, false), transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); scene.add(m); return m;
}
const lathe = (pts, mat, seg = 128) => { const m = new THREE.Mesh(new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), seg), mat); m.castShadow = true; m.receiveShadow = true; return m; };
function band(r, h, arc, mat, seg = 128) { return new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg, 1, true, -arc / 2, arc), mat); }
function frusta(rTop, rBot, h, arc, mat) { return new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, 128, 1, true, -arc / 2, arc), mat); }
function card(w, h, t, faceMat, backMat, edgeColor = 0xece8df, r = .02) {
  const edge = new THREE.MeshStandardMaterial({ color: edgeColor, roughness: .6 });
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, t, h, 3, r), [edge, edge, faceMat, backMat, edge, edge]); m.castShadow = true; m.receiveShadow = true; return m;
}
// logo images that read on a surface: principal when drawn for it, otherwise a one-ink print
async function logoFor(surface, kind = 'v') {
  const files = { v: 'logo-vertical.svg', h: 'logo-horizontal.svg', m: 'logo-simbolo.svg' };
  const base = B.versions[0].bg, inv = B.versions[3].bg;
  if (dist(surface, base) < 46) return { img: await logo(files[kind]), color: null };
  if (kind === 'h' && dist(surface, inv) < 46) return { img: await logo('logo-inversa.svg'), color: null };
  const inks = [...pal, '#ffffff', '#141414'].sort((a, b) => Math.abs(lum(b) - lum(surface)) - Math.abs(lum(a) - lum(surface)));
  const ink = inks.find((h) => sat(h) > .35 && Math.abs(lum(h) - lum(surface)) > .35) || inks[0];
  return { img: await logo(files[kind]), color: ink };
}

// ================================================================ scenes
const S = {};

S.cards = async () => {
  studio(lightBackdrop());
  camera.position.set(-.1, 7.6, 5.9); camera.lookAt(-.08, 0, .05);
  const w = 3.5, d = 2.0, th = .03;
  const front = grain(rasterArt(await art('card-front.svg'), 1750, 1000), 8);
  const backPlain = grain(rasterArt(await art(GOLD ? 'card-back-plain.svg' : 'card-back.svg'), 1750, 1000), 8);
  const faceL = paperMat(tex(front), .82), faceD = paperMat(tex(backPlain), .7);
  const mk = (x, z, rot, top, bottom, elev) => { const m = card(w, d, th, top, bottom, onDark ? 0x2a2a2a : 0xebe6dc, .015); m.position.set(x, th / 2 + elev, z); m.rotation.y = rot; scene.add(m); return m; };
  const back = mk(-1.05, -.55, .32, faceD, faceD, .0);
  if (GOLD) { const a = tex(alphaOf(await layer(await logo('logo-simbolo.svg'), 1750, 1000, [875, 500, 600, 600], '#fff', 1)), false);
    const f = new THREE.Mesh(new THREE.PlaneGeometry(w, d), goldMat(a)); f.rotation.x = -Math.PI / 2; f.position.y = th / 2 + .002; back.add(f); }
  mk(-.9, -.6, .26, faceD, faceD, -.02);
  mk(.95, .6, -.18, faceL, faceD, .035);
  contactShadow(-1.2, -.5, 4.6, 3.0, .3); contactShadow(1.05, .6, 4.6, 3.0, .3);
};

S.mug = async () => {
  studio(lightBackdrop());
  camera.position.set(.15, 2.3, 7.4); camera.lookAt(.12, 1.0, 0);
  async function mug(x, z, rot, s, body, surface) {
    const g = new THREE.Group(); const R = .78, Hh = 1.9, t = .06;
    const ceramic = new THREE.MeshPhysicalMaterial({ color: body, roughness: .2, clearcoat: 1, clearcoatRoughness: .08, envMapIntensity: .9 });
    g.add(lathe([[0, 0], [R - .1, 0], [R - .02, .03], [R, .12], [R, Hh - .04], [R - .006, Hh - .01], [R - .02, Hh], [R - t + .02, Hh], [R - t + .004, Hh - .012], [R - t, Hh - .04], [R - t, .14], [0, .14]], ceramic, 192));
    const coffee = new THREE.Mesh(new THREE.CircleGeometry(R - t - .005, 64), new THREE.MeshPhysicalMaterial({ color: 0x2b170c, roughness: .15, clearcoat: 1 }));
    coffee.rotation.x = -Math.PI / 2; coffee.position.y = Hh - .22; g.add(coffee);
    const hc = new THREE.CatmullRomCurve3([[R - .04, 1.52], [R + .2, 1.56], [R + .44, 1.42], [R + .5, 1.05], [R + .4, .66], [R + .18, .5], [R - .04, .5]].map(([x, y]) => new THREE.Vector3(x, y, 0)));
    const handle = new THREE.Mesh(new THREE.TubeGeometry(hc, 96, .075, 24), ceramic); handle.scale.z = 1.25; handle.castShadow = true; g.add(handle);
    const { img, color } = await logoFor(surface, 'v');
    const L = 1.9, Lh = 1.35;
    const print = band(R + .002, Lh, L, new THREE.MeshPhysicalMaterial({ map: tex(await layer(img, 1400, 1000, [700, 500, 760, 760], color)), transparent: true, roughness: .25, clearcoat: 1 }));
    print.position.y = .25 + Lh / 2; g.add(print);
    g.position.set(x, 0, z); g.rotation.y = rot; g.scale.setScalar(s); scene.add(g);
    contactShadow(x + .15, z + .1, 2.4 * s, 2.0 * s, .5);
  }
  await mug(-1.15, .2, -.35, 1, '#f4f1ec', '#f4f1ec');
  await mug(1.25, -.6, .25, .92, strong, strong);
};

S.box = async () => {
  studio(lightBackdrop());
  camera.position.set(3.7, 3.6, 6.7); camera.lookAt(-.62, .68, .35);
  const Sx = 2048;
  const mkFace = async (kind) => { const [c, g] = canvas(Sx, Sx, strong); if (kind === 'front' && !GOLD) { const { img, color } = await logoFor(strong, 'v'); put(g, await layer(img, Sx, Sx, [Sx / 2, Sx / 2, 1150, 1150], color)); } return grain(c, 8); };
  const sideC = await (async () => { const [c, g] = canvas(Sx, Sx, mix(strong, '#000', .05)); const sym = await logo('logo-simbolo.svg'); const t = tint(sym, onDark ? (GOLD || '#fff') : '#fff', 400, 400);
    g.globalAlpha = .16; for (let y = 120; y < Sx; y += 360) for (let x = (y / 360) % 2 ? 300 : 120; x < Sx; x += 360) draw(g, t, x, y, 170, 170); return grain(c, 8); })();
  const front = await mkFace('front');
  const mat = (c) => paperMat(tex(c), .6);
  const m = new THREE.Mesh(new RoundedBoxGeometry(2.4, 1.5, 2.4, 6, .04), [mat(sideC), mat(sideC), mat(front), mat(front), mat(front), mat(front)]);
  m.position.y = .75; m.rotation.y = .5; m.castShadow = m.receiveShadow = true; scene.add(m);
  if (GOLD) {
    const fa = tex(alphaOf(await layer(await logo('logo-horizontal.svg'), Sx, 1280, [Sx / 2, 640, 1500, 560], '#fff', 1)), false);
    const fm = goldMat(fa); Object.assign(fm, { color: new THREE.Color(0xe6c06a), metalness: .78, roughness: .3, envMapIntensity: 2.2 }); const f = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.5), fm); f.position.z = 1.2011; m.add(f);
    const ta = tex(alphaOf(await layer(await logo('logo-simbolo.svg'), Sx, Sx, [Sx / 2, Sx / 2, 900, 900], '#fff', 1)), false);
    const t = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 2.4), goldMat(ta)); t.rotation.x = -Math.PI / 2; t.position.y = .7511; m.add(t);
  }
  const seam = new THREE.Mesh(new THREE.BoxGeometry(2.42, .012, 2.42), new THREE.MeshStandardMaterial({ color: mix(strong, '#000', .5), roughness: .8 })); seam.position.y = .25; m.add(seam);
  const lightFace = (() => { const [c] = canvas(Sx, Sx, lightC); return grain(c, 8); })();
  const { img, color } = await logoFor(lightC, 'h');
  const lf = (() => { const [c, g] = canvas(Sx, Sx, lightC); return [c, g]; })(); put(lf[1], await layer(img, Sx, Sx, [Sx / 2, Sx / 2, 1500, 700], color));
  const topT = tex(grain(lf[0], 8)); topT.center.set(.5, .5); topT.rotation = 0;
  const m2 = new THREE.Mesh(new RoundedBoxGeometry(1.4, .62, 1.4, 6, .03), [mat(lightFace), mat(lightFace), paperMat(topT, .6), mat(lightFace), mat(lightFace), mat(lightFace)]);
  m2.position.set(-1.75, .31, 1.55); m2.rotation.y = .18; m2.castShadow = m2.receiveShadow = true; scene.add(m2);
  contactShadow(.1, .1, 4.2, 4.2, .45); contactShadow(-1.72, 1.6, 2.4, 2.4, .45);
};

S.bag = async () => {
  studio(lightBackdrop());
  camera.position.set(1.2, 3.0, 9.2); camera.lookAt(.2, 1.55, 0);
  async function bag(x, z, rot, w, h, d, color, kraft) {
    const g = new THREE.Group();
    const [fc, fg] = canvas(1200, 1400, color);
    const { img, color: ink } = await logoFor(color, 'v');
    put(fg, await layer(img, 1200, 1400, [600, 720, 760, 760], ink));
    if (kraft) { fg.globalAlpha = .08; for (let i = 0; i < 2600; i++) { fg.fillStyle = Math.random() > .5 ? '#000' : '#fff'; fg.fillRect(Math.random() * 1200, Math.random() * 1400, 1 + Math.random() * 30, 1); } fg.globalAlpha = 1; }
    grain(fc, kraft ? 26 : 10);
    const paper = new THREE.MeshStandardMaterial({ map: tex(fc), roughness: kraft ? .95 : .62, envMapIntensity: .35, side: THREE.DoubleSide });
    const plain = new THREE.MeshStandardMaterial({ color, roughness: kraft ? .95 : .62, envMapIntensity: .35, side: THREE.DoubleSide });
    const fr = new THREE.Mesh(new THREE.PlaneGeometry(w, h), paper); fr.position.set(0, h / 2, d / 2); g.add(fr);
    const bk = new THREE.Mesh(new THREE.PlaneGeometry(w, h), plain); bk.position.set(0, h / 2, -d / 2); g.add(bk);
    for (const sx of [-1, 1]) {  // side gussets folded inward
      const half = new THREE.PlaneGeometry(d / 2 * 1.04, h);
      for (const sz of [-1, 1]) { const p = new THREE.Mesh(half, plain); p.position.set(sx * (w / 2 - .06), h / 2, sz * d / 4); p.rotation.y = Math.PI / 2 + sx * sz * .18; g.add(p); }
    }
    const fold = new THREE.Mesh(new THREE.PlaneGeometry(w, .2), new THREE.MeshStandardMaterial({ color: mix(color, '#000', .12), roughness: .9, side: THREE.DoubleSide })); fold.position.set(0, h - .1, d / 2 + .003); g.add(fold);
    const rope = new THREE.MeshPhysicalMaterial({ color: kraft ? '#8b6a43' : SEC, roughness: .6, sheen: .6 });
    for (const zz of [d / 2 + .01, -d / 2 - .01]) {
      const c = new THREE.CatmullRomCurve3([new THREE.Vector3(-w * .2, h - .2, zz), new THREE.Vector3(-w * .2, h + .45, zz), new THREE.Vector3(0, h + .75, zz), new THREE.Vector3(w * .2, h + .45, zz), new THREE.Vector3(w * .2, h - .2, zz)]);
      const hdl = new THREE.Mesh(new THREE.TubeGeometry(c, 64, .035, 12), rope); hdl.castShadow = true; g.add(hdl);
    }
    g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    g.position.set(x, 0, z); g.rotation.y = rot; scene.add(g);
    contactShadow(x, z, w * 1.6, d * 2.2, .45);
  }
  await bag(-1.55, .1, .32, 2.1, 2.5, .9, '#c49a6c', true);
  await bag(1.35, -.4, -.22, 2.4, 3.0, 1.0, strong, false);
};

S.cup = async () => {
  studio(lightBackdrop());
  camera.position.set(.2, 2.2, 7.6); camera.lookAt(.1, 1.25, 0);
  async function cup(x, z, rot, s, body, sleeve) {
    const g = new THREE.Group(); const rt = .78, rb = .58, Hh = 2.4;
    const paper = new THREE.MeshPhysicalMaterial({ color: body, roughness: .55, clearcoat: .3 });
    g.add(lathe([[0, 0], [rb, 0], [rb + .01, .03], [rt, Hh], [rt + .02, Hh + .03], [0, Hh + .03]], paper));
    const lidM = new THREE.MeshPhysicalMaterial({ color: onDark ? '#f3f1ec' : '#1d1d1f', roughness: .35, clearcoat: .6 });
    g.add(lathe([[0, Hh + .03], [rt + .05, Hh + .03], [rt + .06, Hh + .12], [rt - .02, Hh + .16], [rt - .1, Hh + .32], [0, Hh + .36]], lidM));
    const y0 = .65, y1 = 1.75, r0 = rb + (rt - rb) * y0 / Hh, r1 = rb + (rt - rb) * y1 / Hh;
    const sc = sleeve || body;
    const [c, gg] = canvas(1600, 700, sc); const { img, color } = await logoFor(sc, sleeve ? 'v' : 'v');
    put(gg, await layer(img, 1600, 700, [800, 350, 560, 520], color)); grain(c, 10);
    const sl = new THREE.Mesh(new THREE.CylinderGeometry(r1 + .012, r0 + .012, y1 - y0, 128, 1, true, -1.1, 2.2), new THREE.MeshStandardMaterial({ map: tex(c), roughness: .8 }));
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(r1 + .011, r0 + .011, y1 - y0, 128, 1, true), new THREE.MeshStandardMaterial({ color: sc, roughness: .8 }));
    sl.position.y = ring.position.y = (y0 + y1) / 2; g.add(ring, sl);
    g.traverse((o) => { if (o.isMesh) o.castShadow = true; });

// ---- stand-up pouches: two quilted surfaces bulging between flat side seals
function pouchMesh(art, backColor, W = 1.8, H = 2.7, bulge = .32) {
  const g = new THREE.Group(); const NX = 48, NY = 72;
  const mk = (sign, mat) => {
    const geo = new THREE.PlaneGeometry(W, H, NX, NY); const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) { const u = pos.getX(i) / W + .5, v = pos.getY(i) / H + .5;
      const across = Math.sin(Math.PI * Math.min(Math.max((u - .03) / .94, 0), 1)) ** .55;
      const along = v < .12 ? .75 + .25 * (v / .12) : v > .86 ? Math.max(0, 1 - (v - .86) / .08) ** 1.5 : 1;
      const wav = .004 * Math.sin(v * 26 + u * 5) * across;
      pos.setZ(i, sign * (bulge * across * along + wav)); pos.setX(i, pos.getX(i) * (1 - .05 * along * across)); }
    geo.computeVertexNormals(); const m = new THREE.Mesh(geo, mat); m.castShadow = m.receiveShadow = true; return m; };
  const front = mk(1, new THREE.MeshPhysicalMaterial({ map: tex(art), roughness: .55, clearcoat: .3, clearcoatRoughness: .4, envMapIntensity: .5, side: THREE.DoubleSide }));
  const backM = mk(-1, plain(backColor, .6, { side: THREE.DoubleSide }));
  g.add(front, backM);
  const bottom = new THREE.Mesh(new THREE.CircleGeometry(1, 48), plain(mix(backColor, '#000', .15), .7)); bottom.scale.set(W * .47, bulge * 1.5, 1); bottom.rotation.x = -Math.PI / 2; bottom.position.y = -H / 2 + .005; g.add(bottom);
  g.position.y = H / 2; return g;
}
